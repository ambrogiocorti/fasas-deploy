name: FASAS Cloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fasas
          POSTGRES_PASSWORD: fasas
          POSTGRES_DB: fasas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FASAS_ENCRYPTION_KEYS: Y2ktb25seS1mYXNhcy1lbmNyeXB0aW9uLWtleS0wMDA=
      FASAS_BACKUP_KEY: Y2ktb25seS1mYXNhcy1iYWNrdXAta2V5LTAwMDAwMDA=
      FASAS_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install "moto[s3]>=5.0" "ruff>=0.6"
      - name: Installa SoftHSM2 e il Signer per provare un token PKCS#11 reale
        if: matrix.database == 'sqlite'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 libsofthsm2
          pip install --require-hashes -r signer/requirements.lock
          softhsm2-util --version
          python manage.py shell -c "from fasas.tests.test_cie_signer_pkcs11 import HAVE_PKCS11; assert HAVE_PKCS11, 'SoftHSM2 non disponibile nel test'"
      - run: ruff check fasas config
      - name: Imposta database
        if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://fasas:fasas@localhost:5432/fasas" >> "$GITHUB_ENV"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
      - run: python manage.py test fasas.tests

  accessibilita:
    # Pagine principali per ogni ruolo controllate con axe-core (WCAG 2.1 A e AA), in chiaro e in scuro
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      FASAS_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements.lock
      - run: python manage.py migrate --verbosity 0
      - run: python manage.py fasas_demo --skip-if-exists --ambiente-di-prova
      - name: FASAS avviato
        run: |
          python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8765/accesso/entra/ && break; sleep 1; done
      - name: Controllo di accessibilità
        run: |
          npm install --no-save --no-audit --no-fund axe-core@4.10.2 playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/accessibilita.js
      - name: Registro del server in caso di errore
        if: failure()
        run: tail -50 /tmp/server.log

  cloud:
    # Versione cloud (docs/CLOUD.md): migrazioni SQL di supabase/migrations applicate al PostgreSQL ufficiale di
    # Supabase come dall'editor SQL, immagine avviata con FASAS_CLOUD=1 (sito + pianificatore, porta $PORT), file su
    # object storage S3 di prova, poi prova completa via HTTP come dietro il dominio e ripristino di un backup.
    runs-on: ubuntu-latest
    env:
      SUPABASE_POSTGRES_IMAGE: supabase/postgres:17.11.0.017
      DB_URL: postgresql://postgres:prova-ci-supabase@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL di Supabase
        run: |
          docker run -d --name supabase-db -p 5432:5432 -e POSTGRES_PASSWORD=prova-ci-supabase "$SUPABASE_POSTGRES_IMAGE"
          for i in $(seq 1 60); do
            psql "$DB_URL" -Atc "SELECT 1" > /dev/null 2>&1 && break
            sleep 3
          done
          psql "$DB_URL" -Atc "SELECT version(), current_user, (SELECT rolsuper FROM pg_roles WHERE rolname = current_user)"
          psql "$DB_URL" -Atc "SELECT string_agg(rolname, ', ') FROM pg_roles WHERE rolname IN ('anon', 'authenticated', 'service_role')"
      - name: Migrazioni SQL (come nell'editor SQL di Supabase, utente postgres)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done
          # una seconda volta il file di protezione: si può rieseguire
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/*_fasas_protezione_api.sql
      - name: Le API di Supabase non arrivano ai dati
        run: |
          test "$(psql "$DB_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity")" = 0
          test "$(psql "$DB_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema = 'public' AND grantee IN ('anon', 'authenticated', 'service_role')")" = 0
          for role in anon authenticated service_role; do
            if psql "$DB_URL" -Atc "SET ROLE $role; SELECT count(*) FROM public.core_systemconfig" 2>/dev/null; then
              echo "il ruolo $role legge le tabelle"; exit 1
            fi
          done
      - name: Storage S3 di prova
        run: |
          pip install "moto[server]==5.2.4" "boto3==1.43.122" "requests==2.34.2"
          moto_server -p 5055 > moto.log 2>&1 &
          sleep 3
          python -c "import boto3; s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:5055', region_name='eu-central-1', aws_access_key_id='prova', aws_secret_access_key='prova'); [s3.create_bucket(Bucket=b, CreateBucketConfiguration={'LocationConstraint': 'eu-central-1'}) for b in ('fasas-documenti', 'fasas-backup')]"
      - run: docker build -t fasas:cloud .
      - name: Avvio in modalità cloud
        run: |
          python3 -c "import base64,os,secrets; print('DJANGO_SECRET_KEY=' + secrets.token_hex(32)); print('FASAS_ENCRYPTION_KEYS=' + base64.urlsafe_b64encode(os.urandom(32)).decode()); print('FASAS_BACKUP_KEY=' + base64.urlsafe_b64encode(os.urandom(32)).decode())" > cloud.env
          cat >> cloud.env <<'EOF'
          FASAS_CLOUD=1
          PORT=8123
          FASAS_DOMAIN=fasas.prova.it
          DATABASE_URL=postgresql://postgres:prova-ci-supabase@127.0.0.1:5432/postgres
          FASAS_BACKUP_PG_SCHEMAS=public
          FASAS_S3_BUCKET=fasas-documenti
          FASAS_S3_ENDPOINT_URL=http://127.0.0.1:5055
          FASAS_S3_REGION=eu-central-1
          FASAS_S3_ACCESS_KEY=prova
          FASAS_S3_SECRET_KEY=prova
          FASAS_S3_DEFAULT_ACL=
          FASAS_S3_ADDRESSING_STYLE=path
          FASAS_OFFSITE_ENDPOINT=http://127.0.0.1:5055
          FASAS_OFFSITE_REGION=eu-central-1
          FASAS_OFFSITE_BUCKET=fasas-backup
          FASAS_OFFSITE_ACCESS_KEY=prova
          FASAS_OFFSITE_SECRET_KEY=prova
          FASAS_OFFSITE_LOCK_DAYS=0
          FASAS_OFFSITE_CONTENT_MD5=0
          FASAS_OFFSITE_ADDRESSING_STYLE=path
          FASAS_ADMIN_USERNAME=amministratore
          FASAS_ADMIN_PASSWORD=Prova-Cloud-2026!x
          FASAS_2FA_REQUIRED_ROLES=
          FASAS_HEALTH_TOKEN=token-di-prova-salute
          GUNICORN_WORKERS=1
          GUNICORN_THREADS=8
          EOF
          sed -i 's/^ *//' cloud.env
          docker run -d --name fasas --network host --env-file cloud.env fasas:cloud
          for i in $(seq 1 60); do
            curl -sf -H "Host: 10.0.0.9" http://127.0.0.1:8123/salute/ && break
            sleep 3
          done
          docker logs fasas 2>&1 | head -20
      - name: Ospite di prova (dati inventati)
        run: |
          docker exec -i fasas python manage.py shell <<'PY' | tail -1 > ospite.txt
          import datetime
          from fasas.audit.context import audit_context
          from fasas.core.models import Community
          from fasas.guests.models import Guest
          with audit_context(source="prova"):
              guest = Guest.objects.create(first_name="Mario", last_name="Prova", fiscal_code="RSSMRA40A01F205X",
                                           birth_date=datetime.date(1940, 1, 1), community=Community.default())
          print(guest.pk)
          PY
          cat ospite.txt
      - name: Prova completa via HTTP
        run: python scripts/prova_cloud.py "$(cat ospite.txt)"
      - name: Ripristino del backup sopra il database in uso (lo schema public di Supabase resta)
        run: |
          # backup nuovo, con l'ospite e il documento appena caricati (quello dell'avvio è precedente)
          docker exec fasas python manage.py fasas_jobs backup
          docker exec fasas sh -c 'python manage.py backup_restore --confirm "$(ls -t /data/backups/*.fbk | head -1)"'
          docker exec fasas python manage.py audit_verify
          usage=$(psql "$DB_URL" -Atc "SELECT has_schema_privilege('anon', 'public', 'USAGE')")
          guests=$(psql "$DB_URL" -Atc "SELECT count(*) FROM public.guests_guest")
          versions=$(psql "$DB_URL" -Atc "SELECT count(*) FROM public.documents_documentversion")
          echo "schema public usabile da anon (come prima): $usage; ospiti: $guests; versioni di documenti: $versions"
          test "$usage" = t && test "$guests" = 1 && test "$versions" = 1
          test "$(psql "$DB_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity")" = 0
          test "$(psql "$DB_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema = 'public' AND grantee IN ('anon', 'authenticated', 'service_role')")" = 0
          # dopo il ripristino il documento si scarica ancora (file rimessi nel bucket)
          python scripts/prova_cloud.py "$(cat ospite.txt)"
      - name: Memoria usata dal container
        run: docker stats --no-stream fasas
      - name: Log in caso di errore
        if: failure()
        run: |
          docker logs fasas 2>&1 | tail -150
          docker logs supabase-db 2>&1 | tail -40
          tail -20 moto.log

  sicurezza:
    # Vulnerabilità note nelle dipendenze bloccate e analisi statica del codice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: bandit -q -r fasas config -x fasas/tests,*/migrations/* -ll
